[package]
name = "mod-tab"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
# Only crates in Horizon's Cargo.lock (a589a3dd9).
serde_json = "1"
# MySQL storage (`mysql.enabled`): the crate husksync and luckperms use (28.0.4 in perm-sdk's lock).
mysql = { version = "28", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# `proxy-support.type: REDIS` (pub/sub): the crate husksync and luckperms use.
redis = { version = "1", default-features = false, features = ["tls-rustls", "sentinel"] }
# `proxy-support.type: RABBITMQ`: lapin on its own thread, as luckperms does.
lapin = { version = "4", default-features = false, features = ["tokio", "rustls--ring"] }
tokio = { version = "1", default-features = false, features = ["rt", "time", "sync"] }
