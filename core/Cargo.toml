[package]
name = "horizon-tab-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Tab list, name tags, sorting, scoreboard and a placeholder registry for Horizon servers"
publish = false

[lib]
name = "horizon_tab"

[dependencies]
# Only crates in Horizon's Cargo.lock (a589a3dd9).
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
