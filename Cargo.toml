[package]
name = "mod-tab"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
# Only crates in Horizon's Cargo.lock (a589a3dd9).
serde_json = "1"
# MySQL storage (`mysql.enabled`): the crate husksync and luckperms use (28.0.4 in perm-sdk's lock).
mysql = { version = "28", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }


[features]
# Calls that exist on Horizon main only (player latency/nickname/hidden reads, per-player sidebar, tab list
# name, scoreboard teams, send packet). Off by default: the pinned SDK does not have them.
horizon_main_api = []
# `player_protocol_version` (PR branch `api-player-protocol`, #18797): `%player-version%` and `%player-version-id%`.
horizon_protocol_api = []
# Team prefix, suffix, name tag visibility, collision rule and friendly fire (branch `api-scoreboard-team-options`,
# #18817, stacked on #17980): needs the team calls of `horizon_main_api`.
horizon_team_options_api = ["horizon_main_api"]
